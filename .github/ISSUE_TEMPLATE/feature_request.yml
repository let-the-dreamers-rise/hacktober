name: Feature request
description: Suggest a builtin, a tool, a transpiler target or any other improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: How it would look in a Chimera program or on the command line.
      render: text
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to get the same result today, if any.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to implement this myself
