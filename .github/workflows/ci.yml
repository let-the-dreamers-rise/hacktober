name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install || rustup show  # installs the toolchain from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install || rustup show  # installs the toolchain from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # The transpiler round-trip test runs the generated code on these.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: cargo test --workspace
      - name: Run the examples through the CLI
        shell: bash
        run: |
          cargo build --release
          for f in examples/*.chi; do
            echo "::group::$f"
            ./target/release/chimera --offline "$f"
            echo "::endgroup::"
          done

  msrv:
    name: Minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 build --workspace --all-targets
